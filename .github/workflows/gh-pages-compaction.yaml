name: gh-pages history compaction

# Collapses the accumulated commit history on the gh-pages branch into a single
# fresh commit that still contains the *current* published report tree (all
# categories, latest + retained numbered folders). This reclaims the git object
# space that keep_files:true deploys never free, preventing the GitHub Pages
# "build and deployment" job from running out of disk on large branches.

permissions:
  contents: write

on:
  schedule:
    - cron: '30 1 1 * *'  # 01:30 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      chosen-os:
        description: Choose runner
        required: false
        default: az-dev-ubuntu-latest-8Core
        type: choice
        options:
          - az-dev-ubuntu-latest
          - az-dev-ubuntu-latest-4Core
          - az-dev-ubuntu-latest-8Core
          - az-dev-ubuntu-latest-16Core
          - az-prod-ubuntu-latest-8Core
          - az-prod-ubuntu-latest
          - az-prod-ubuntu-24
          - az-prod-ubuntu-22
      dry-run:
        description: 'Report size only, do not rewrite/force-push gh-pages'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: gh-pages-compaction
  cancel-in-progress: false

jobs:
  compact:
    name: Compact gh-pages history
    runs-on: ["${{ github.event.inputs.chosen-os || 'az-dev-ubuntu-latest-8Core' }}"]
    steps:
      - name: Checkout gh-pages (full history for size reporting)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0
          path: gh-pages

      - name: Report current branch size
        working-directory: gh-pages
        shell: bash
        run: |
          set -euxo pipefail
          echo "Working tree size:"
          du -sh . || true
          echo "Git object store size:"
          du -sh .git || true
          echo "Commit count on gh-pages:"
          git rev-list --count HEAD || true

      - name: Content breakdown (what is using the space)
        working-directory: gh-pages
        shell: bash
        run: |
          set -uxo pipefail

          echo "===== Top-level entries ====="
          du -sh ./* 2>/dev/null | sort -rh | head -30 || true

          if [ -d PSAutomationReports ]; then
            echo "===== Per category ====="
            du -sh PSAutomationReports/*/ 2>/dev/null | sort -rh || true

            echo "===== Per report folder (top 40) ====="
            du -sh PSAutomationReports/*/*/ 2>/dev/null | sort -rh | head -40 || true

            echo "===== Retained numbered folders per category ====="
            for cat in PSAutomationReports/*/; do
              count=$(find "$cat" -maxdepth 1 -type d -regextype posix-extended -regex '.*/[0-9]+' 2>/dev/null | wc -l)
              printf '%5s folders  %s\n' "$count" "$cat"
            done
          fi

          echo "===== Largest files overall (top 30) ====="
          find . -type f -not -path './.git/*' -printf '%s\t%p\n' 2>/dev/null \
            | sort -rn | head -30 \
            | awk -F'\t' '{ printf "%8.1f MB  %s\n", $1/1048576, $2 }' || true

          echo "===== Disk usage by file extension (top 25) ====="
          find . -type f -not -path './.git/*' -printf '%s\t%f\n' 2>/dev/null \
            | awk -F'\t' '{
                n=split($2,a,"."); ext=(n>1?a[n]:"<none>");
                bytes[ext]+=$1; cnt[ext]++
              }
              END { for (e in bytes) printf "%12.1f MB  %8d files  .%s\n", bytes[e]/1048576, cnt[e], e }' \
            | sort -rn | head -25 || true

      - name: Compact history and force-push
        if: ${{ github.event.inputs.dry-run != 'true' }}
        working-directory: gh-pages
        shell: bash
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Make sure we have the very latest tip before rewriting.
          git fetch origin gh-pages
          git checkout gh-pages
          git reset --hard origin/gh-pages

          # Build a single orphan commit that contains ONLY the current tree.
          git checkout --orphan gh-pages-compact
          git add -A
          git commit -m "Compact gh-pages history (reclaim disk, keep current reports)"

          # Replace the branch and force-push the single-commit history.
          # Use --force-with-lease so a concurrent report deploy that moved
          # gh-pages after our fetch makes this push fail (retry next run)
          # instead of silently clobbering that freshly published report.
          git branch -D gh-pages
          git branch -m gh-pages
          git push --force-with-lease origin gh-pages

          # Shrink the local object store (ephemeral runner; does not affect remote).
          git reflog expire --expire=now --all || true
          git gc --prune=now || true

          echo "Compaction complete. New branch size:"
          du -sh . || true
          du -sh .git || true

      - name: Dry-run notice
        if: ${{ github.event.inputs.dry-run == 'true' }}
        run: |
            echo "Dry-run: sizes reported above, gh-pages was NOT rewritten."

  deploy-pages:
    name: Deploy GitHub Pages
    needs: compact
    if: always() && needs.compact.result == 'success' && github.event.inputs.dry-run != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/github-pages-deploy.yaml
    secrets: inherit
