name: Playwright UI Performance

permissions:
  contents: write

on:
  schedule:
    # Runs automatically at 1:00 AM IST every day.
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      chosen-os:
        description: Choose runner
        required: true
        default: az-dev-ubuntu-latest-8Core
        type: choice
        options:
          - az-dev-ubuntu-latest
          - az-dev-ubuntu-latest-4Core
          - az-dev-ubuntu-latest-8Core
          - az-dev-ubuntu-latest-16Core
          - az-prod-ubuntu-latest
          - az-prod-ubuntu-24
          - az-prod-ubuntu-22
          - az-prod-ubuntu-latest-4Core
          - az-prod-ubuntu-latest-8Core
          - az-prod-ubuntu-latest-16Core
          - 2Core
          - 4Core
          - 8Core
          - 16Core
      test-type:
        description: Choose testing type
        required: false
        default: "saucelabs"
        type: choice
        options:
          - local
          - saucelabs
      environment:
        description: Choose environment
        required: false
        default: "INTEROP"
        type: choice
        options:
          - INTEROP
          - PSR
      branch:
        description: Branch to run workflow on
        required: false
        default: "main"
        type: string
      enable-html-report:
        description: 'Generate and upload Playwright HTML Report (default: false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      retries:
        description: 'Number of retries for failed tests (default: 1)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
          - '2'
          - '3'

env:
  PW_ENABLE_HTML_REPORT: ${{ github.event.inputs['enable-html-report'] || 'false' }}
  PW_RETRIES: ${{ github.event.inputs.retries || '1' }}
  SAUCE_USERNAME: ${{ secrets.SAUCE_PS_USERNAME }}
  SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_PS_ACCESS_KEY }}
  TEST_AUTOMATION_USER_1: ${{ secrets.TEST_AUTOMATION_USER_1 }}
  TEST_AUTOMATION_USER_2: ${{ secrets.TEST_AUTOMATION_USER_2 }}
  TEST_AUTOMATION_PASSWORD: ${{ secrets.TEST_AUTOMATION_PASSWORD }}
  CLIENT_SECRET_QA: ${{ secrets.CLIENT_SECRET_QA_CBP_E2E_QA }}
  REALM_CLIENT_SECRET_PO_QA_MIG_1: ${{ secrets.CLIENT_SECRET_QA_CBP_PO_MIG_1 }}
  REALM_CLIENT_SECRET_PO_QA_MIG_2: ${{ secrets.CLIENT_SECRET_QA_CBP_PO_MIG_2 }}
  CLIENT_SECRET_IOP: ${{ secrets.CLIENT_SECRET_IOP_CBP_INTEROP_PS_AUTOMATION_2 }}
  REALM_CLIENT_SECRET_PO_IOP_MIG_1: ${{ secrets.CLIENT_SECRET_IOP_CBP_PO_MIG_1 }}
  REALM_CLIENT_SECRET_PO_IOP_MIG_2: ${{ secrets.CLIENT_SECRET_IOP_CBP_PO_MIG_2 }}
  # Centralized report location + GitHub Pages base URL used across report generation,
  # retention and run-summary steps. Update these in one place if the project/report
  # name or the Pages site changes.
  REPORT_PATH: PSAutomationReports/PLAYWRIGHT-SAUCELABS
  PAGES_BASE_URL: https://supreme-adventure-mr9k94p.pages.github.io

jobs:
  playwright-saucelabs:
    name: Run Playwright Performance Tests
    runs-on: ["${{ github.event_name == 'schedule' && 'az-dev-ubuntu-latest-8Core' || github.event.inputs.chosen-os || 'az-prod-ubuntu-latest-8Core' }}"]
    outputs:
      artifact-url: ${{ steps.get-artifact-url.outputs.artifact-url }}
      test-outcome: ${{ steps.tests.outcome }}
    steps:
      - name: Checkout ${{ github.event.inputs.branch || 'main' }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Authenticate with npm (JFrog)
        run: |
          npm config set @jda:registry "https://jdasoftware.jfrog.io/jdasoftware/api/npm/npm/"
          npm config set "//jdasoftware.jfrog.io/jdasoftware/api/npm/npm/:_authToken" "${{ secrets.JFROG_AUTH_TOKEN2 }}"
      - name: Install saucectl
        run: |
          if [[ "${{ github.event.inputs['test-type'] }}" == "saucelabs" || "${{ github.event_name }}" == "schedule" ]]; then
            npm install -g saucectl
          fi
      - name: Install Dependencies
        working-directory: playwright-e2e
        run: npm ci

      - name: Run Playwright Tests
        id: tests
        working-directory: playwright-e2e
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'INTEROP' }}
          TZ: Australia/Adelaide
          PW_ENABLE_HTML_REPORT: ${{ env.PW_ENABLE_HTML_REPORT }}
          PW_RETRIES: ${{ env.PW_RETRIES }}
        run: |
          ENVIRONMENT=${{ github.event.inputs.environment || 'INTEROP' }}
          if [[ "${{ github.event.inputs['test-type'] }}" == "saucelabs" || "${{ github.event_name }}" == "schedule" ]]; then
            echo "=== Running tests on Sauce Labs for environment: $ENVIRONMENT ==="
            if [[ "$ENVIRONMENT" == "INTEROP" ]]; then
              npm run sauce:performance:interop
            elif [[ "$ENVIRONMENT" == "PSR" ]]; then
              npm run sauce:performance:psr
            else
              echo "Unknown environment: $ENVIRONMENT, defaulting to interop"
              npm run sauce:performance:interop
            fi
          else
            echo "=== Running tests locally for environment: $ENVIRONMENT ==="
            if [[ "$ENVIRONMENT" == "INTEROP" ]]; then
              npm run test:interop
            elif [[ "$ENVIRONMENT" == "PSR" ]]; then
              npm run test:psr
            else
              echo "Unknown environment: $ENVIRONMENT, defaulting to interop"
              npm run test:interop
            fi
          fi
        continue-on-error: true

      - name: List Available Artifacts
        working-directory: playwright-e2e
        run: |
          echo "Checking for artifacts..."
          if [ -d "artifacts" ]; then
            find artifacts -type f -name "*.zip" -o -name "*.json" | head -20
          else
            echo "No artifacts directory found"
          fi
      - name: Upload Raw Artifacts
        id: upload-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sauce-labs-artifacts
          path: |
            playwright-e2e/artifacts/
          if-no-files-found: ignore

      - name: Upload Playwright HTML Report
        if: always() && (github.event.inputs['enable-html-report'] == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-html-report
          # Local runs write to reports/; Sauce runs land under artifacts/ after the saucectl download.
          path: |
            playwright-e2e/reports/html-report
            playwright-e2e/artifacts/**/html-report
          if-no-files-found: ignore

      - name: Upload Monocart Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monocart-report
          path: |
            playwright-e2e/reports/monocart-report
            playwright-e2e/artifacts/**/monocart-report
          if-no-files-found: ignore

      - name: Upload Playwright Assets (traces, videos, test-results)
        id: upload-assets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-assets
          path: |
            playwright-e2e/test-results
            playwright-e2e/artifacts/**/test-results
          if-no-files-found: ignore

      - name: Get Artifact URL
        if: always()
        id: get-artifact-url
        run: |
          ASSETS_ID="${{ steps.upload-assets.outputs.artifact-id }}"
          RAW_ID="${{ steps.upload-artifact.outputs.artifact-id }}"
          TARGET_ID="${ASSETS_ID:-$RAW_ID}"
          if [[ -n "$TARGET_ID" ]]; then
            ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${TARGET_ID}"
          else
            ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          echo "artifact-url=$ARTIFACT_URL" >> $GITHUB_OUTPUT
          echo "Artifact URL: $ARTIFACT_URL"
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Download GitHub Artifacts
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sauce-labs-artifacts
          path: playwright-e2e/artifacts-backup/
        continue-on-error: true

      - name: Merge Artifact Sources
        working-directory: playwright-e2e
        run: |
          echo "Merging artifact sources..."
          
          # If primary artifacts exist, use them
          if [ -d "artifacts" ] && [ "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "Using primary Sauce Labs artifacts"
            ls -la artifacts/
          # Otherwise, use backup GitHub artifacts
          elif [ -d "artifacts-backup" ] && [ "$(ls -A artifacts-backup 2>/dev/null)" ]; then
            echo "Using backup GitHub artifacts"
            mv artifacts-backup artifacts
            ls -la artifacts/
          else
            echo "No artifacts found from either source"
            mkdir -p artifacts
          fi
      - name: Extract and Prepare Allure Results
        working-directory: playwright-e2e
        run: |
          mkdir -p reports/allure-results

          echo "Looking for Allure results in artifacts..."

          if [ -f "artifacts/allure-results.zip" ]; then
            echo "Extracting allure-results.zip..."
            unzip -o artifacts/allure-results.zip -d reports/allure-results/
          elif [ -d "artifacts/allure-results" ]; then
            echo "Copying allure-results directory..."
            cp -r artifacts/allure-results/. reports/allure-results/ 2>/dev/null || true
          else
            echo "No direct allure-results found; searching artifacts recursively..."
            # Extract any nested zip archives that may contain allure results
            find artifacts -name "*.zip" -exec unzip -o {} -d reports/allure-results/ \; 2>/dev/null || true
            # Copy any allure JSON result files that are present
            find artifacts -name "*-result.json" -exec cp {} reports/allure-results/ \; 2>/dev/null || true
          fi

          # Verify allure results exist, otherwise create a minimal placeholder
          if [ "$(ls -A reports/allure-results/ 2>/dev/null)" ]; then
            echo "Allure results ready:"
            ls -la reports/allure-results/
          else
            echo "No allure results found, creating minimal test data for report generation"
            cat > reports/allure-results/test-result.json << EOF
          {
            "uuid": "$(uuidgen)",
            "name": "No Test Results Found",
            "status": "broken",
            "stage": "finished",
            "description": "No allure results were found in Sauce Labs artifacts",
            "start": $(date +%s)000,
            "stop": $(date +%s)000
          }
          EOF
          fi
      - name: Upload Processed Allure Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: processed-allure-results
          path: playwright-e2e/reports/allure-results
          if-no-files-found: ignore

  generate-report:
    name: Generate & Deploy Allure Report
    runs-on: ["${{ github.event_name == 'schedule' && 'az-dev-ubuntu-latest-8Core' || github.event.inputs.chosen-os || 'az-prod-ubuntu-latest-8Core' }}"]
    needs: playwright-saucelabs
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout ${{ github.event.inputs.branch || 'main' }} branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 1

      - name: Download Processed Allure Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: processed-allure-results
          path: playwright-e2e/reports/allure-results
        continue-on-error: true

      - name: Checkout gh-pages Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Setup Java (Allure dependency)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Authenticate with npm (JFrog)
        run: |
          npm config set @jda:registry "https://jdasoftware.jfrog.io/jdasoftware/api/npm/npm/"
          npm config set "//jdasoftware.jfrog.io/jdasoftware/api/npm/npm/:_authToken" "${{ secrets.JFROG_AUTH_TOKEN2 }}"

      - name: Install Dependencies for Allure CLI
        working-directory: playwright-e2e
        run: npm ci

      - name: Generate Allure Report (No Docker)
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          RESULTS_DIR="playwright-e2e/reports/allure-results"
          HISTORY_ROOT="playwright-e2e/reports/allure-history/${{ env.REPORT_PATH }}"
          CURRENT_REPORT_DIR="${HISTORY_ROOT}/${{ github.run_number }}"
          LATEST_REPORT_DIR="${HISTORY_ROOT}/latest"
          PREV_ROOT="gh-pages/${{ env.REPORT_PATH }}"
          PREV_HISTORY_DIR="${PREV_ROOT}/latest/history"

          mkdir -p "$RESULTS_DIR" "$HISTORY_ROOT"

          # Restore previously published numbered report folders from gh-pages so the
          # "keep last 7" retention operates over the full history, not just this run.
          if [ -d "$PREV_ROOT" ]; then
            for prev in "$PREV_ROOT"/[0-9]*; do
              [ -d "$prev" ] || continue
              cp -R "$prev" "$HISTORY_ROOT/"
            done
          fi

          if [ -d "$PREV_HISTORY_DIR" ]; then
            cp -R "$PREV_HISTORY_DIR" "$RESULTS_DIR/history"
          fi

          # Safety check: clean trace and video attachments from Allure result JSONs and remove binary files
          node playwright-e2e/scripts/strip-allure-traces.js "$RESULTS_DIR"

          cd playwright-e2e
          npx allure generate reports/allure-results --clean -o "reports/allure-history/${{ env.REPORT_PATH }}/${{ github.run_number }}"
          cd - >/dev/null

          rm -rf "$LATEST_REPORT_DIR"
          cp -R "$CURRENT_REPORT_DIR" "$LATEST_REPORT_DIR"

          cd "$HISTORY_ROOT"
          ls -1d [0-9]* 2>/dev/null | sort -n | head -n -7 | xargs -r rm -rf
          cd - >/dev/null

      - name: Sanitize Allure History for gh-pages Deploy
        if: always()
        continue-on-error: true
        run: |
          set -euxo pipefail
          HISTORY_DIR="playwright-e2e/reports/allure-history"

          if [ -d "$HISTORY_DIR" ]; then
            sudo chown -R "$USER":"$USER" "$HISTORY_DIR" || true
            find "$HISTORY_DIR" -type d -name ".git" -prune -exec sudo rm -rf {} + || true
            chmod -R u+rwX "$HISTORY_DIR" || true
          fi

      - name: Deploy report to Github Pages
        id: deploy-gh-pages
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: playwright-e2e/reports/allure-history
          keep_files: true

      # Suites that finish together all push to gh-pages, so a push can land between this action's clone and its push
      # and get it rejected ("fetch first", or the server's "fatal error in commit_refs"). Each attempt clones gh-pages
      # afresh, so a retry after a random wait publishes on top of the other run instead of losing this run's report.
      - name: Wait before retrying the Github Pages deploy
        if: steps.deploy-gh-pages.outcome == 'failure'
        shell: bash
        run: sleep $((20 + RANDOM % 41))

      - name: Deploy report to Github Pages (retry 1)
        id: deploy-gh-pages-retry
        if: steps.deploy-gh-pages.outcome == 'failure'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: playwright-e2e/reports/allure-history
          keep_files: true

      - name: Wait before the last Github Pages deploy
        if: steps.deploy-gh-pages-retry.outcome == 'failure'
        shell: bash
        run: sleep $((40 + RANDOM % 61))

      - name: Deploy report to Github Pages (retry 2)
        if: steps.deploy-gh-pages-retry.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: playwright-e2e/reports/allure-history
          keep_files: true

      - name: Prune old reports on gh-pages (keep latest + last 7)
        if: always()
        continue-on-error: true
        run: |
          set -euxo pipefail
          REL_DIR="${{ env.REPORT_PATH }}"
          if [ ! -d "gh-pages/$REL_DIR" ]; then
            echo "Category dir not found; nothing to prune."
            exit 0
          fi

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin gh-pages || true
          # Reset latest/ on gh-pages to be a clean copy of the current run directory
          # to prevent accumulation of orphaned attachments over time.
          RUN_NUM_DIR="${REL_DIR}/${{ github.run_number }}"
          if [ -d "$RUN_NUM_DIR" ]; then
            echo "Resetting ${REL_DIR}/latest to clean copy of ${RUN_NUM_DIR}"
            rm -rf "${REL_DIR}/latest"
            cp -R "$RUN_NUM_DIR" "${REL_DIR}/latest"
          fi

          # keep_files:true never deletes superseded numbered folders, so prune them here.
          STALE=$(ls -1d "$REL_DIR"/[0-9]* 2>/dev/null | sort -t/ -k3 -n | head -n -7 || true)
          if [ -n "$STALE" ]; then
            echo "Removing stale report folders:"
            echo "$STALE"
            echo "$STALE" | xargs -r rm -rf
            git add -A
            git commit -m "Prune old ${REL_DIR} reports (keep latest + last 7)" || true
            git push origin gh-pages || true
          else
            echo "No stale folders to prune."
          fi

      - name: Publish Run Summary
        if: always()
        env:
          TITLE: Performance Test Results - PLAYWRIGHT-SAUCELABS - Playwright
          BRANCH: ${{ github.event.inputs.branch || 'main' }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'INTEROP' }}
          TEST_TYPE: ${{ github.event.inputs['test-type'] || 'saucelabs' }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
          REPORT_URL: ${{ env.PAGES_BASE_URL }}/${{ env.REPORT_PATH }}/${{ github.run_number }}
          ARTIFACTS_URL: ${{ needs.playwright-saucelabs.outputs.artifact-url }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          title = os.environ["TITLE"]
          branch = os.environ["BRANCH"]
          environment = os.environ["ENVIRONMENT"]
          test_type = os.environ["TEST_TYPE"]
          run_number = os.environ["RUN_NUMBER"]
          job_status = os.environ["JOB_STATUS"]
          report_url = os.environ["REPORT_URL"]
          artifacts_url = os.environ.get("ARTIFACTS_URL", "")
          workflow_url = os.environ["WORKFLOW_URL"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          print(f"Report URL: {report_url}")
          with open(summary_path, "a", encoding="utf-8") as out:
            out.write(f"## {title}\n\n")
            out.write(f"- Run Number: #{run_number}\n")
            out.write(f"- Job Status: {job_status}\n")
            out.write("\n")
            out.write("### Test Configuration\n")
            out.write(f"- Branch: {branch}\n")
            out.write(f"- Environment: {environment}\n")
            out.write(f"- Test Type: {test_type}\n")
            out.write("\n")
            out.write("### Links\n")
            out.write(f"- Allure Report: {report_url}\n")
            if artifacts_url:
              out.write(f"- Artifacts: {artifacts_url}\n")
            out.write(f"- Workflow Run: {workflow_url}\n")
          PY

      - name: Send Report to Microsoft Teams Channel
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.PS_REPORT_MS_TEAMS_WEBHOOK }}
          REPORT_URL: ${{ env.PAGES_BASE_URL }}/${{ env.REPORT_PATH }}/${{ github.run_number }}
          ARTIFACTS_URL: ${{ needs.playwright-saucelabs.outputs.artifact-url }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEAMS_WEBHOOK_URL)) {
            Write-Host "Teams webhook secret is empty. Skipping notification."
            exit 0
          }

          $title = "Performance Test Results - PLAYWRIGHT-SAUCELABS - Playwright"
          $summary = "Test Run #${{ github.run_number }}: ${{ job.status }}"

          function Send-TeamsPayload {
            param(
              [string]$JsonBody
            )

            $invokeWebRequestParams = @{
              Method = 'Post'
              Uri = $env:TEAMS_WEBHOOK_URL
              Body = $JsonBody
              ContentType = 'application/json'
              SkipHttpErrorCheck = $true
            }
            $response = Invoke-WebRequest @invokeWebRequestParams

            if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
              return $true
            }

            Write-Host "Teams webhook returned status: $($response.StatusCode)"
            return $false
          }

          # Teams Workflows webhooks only render an Adaptive Card envelope. Simpler payloads
          # return 202 (accepted) but post nothing, so send the Adaptive Card directly.
          $adaptivePayload = @{
            type = 'message'
            attachments = @(
              @{
                contentType = 'application/vnd.microsoft.card.adaptive'
                content = @{
                  '$schema' = 'http://adaptivecards.io/schemas/adaptive-card.json'
                  type = 'AdaptiveCard'
                  version = '1.4'
                  body = @(
                    @{
                      type = 'TextBlock'
                      size = 'Medium'
                      weight = 'Bolder'
                      text = $title
                      wrap = $true
                    },
                    @{
                      type = 'TextBlock'
                      text = $summary
                      wrap = $true
                      spacing = 'Small'
                    }
                  )
                  actions = @(
                    @{
                      type = 'Action.OpenUrl'
                      title = 'Allure Report'
                      url = $env:REPORT_URL
                    },
                    @{
                      type = 'Action.OpenUrl'
                      title = 'Download Artifacts'
                      url = $env:ARTIFACTS_URL
                    },
                    @{
                      type = 'Action.OpenUrl'
                      title = 'Workflow Run'
                      url = $env:WORKFLOW_URL
                    }
                  )
                }
              }
            )
          } | ConvertTo-Json -Depth 20

          if (Send-TeamsPayload -JsonBody $adaptivePayload) {
            Write-Host "Teams notification sent using Adaptive Card payload format."
            exit 0
          }

          Write-Host "Unable to send Teams notification with available payload formats."
          exit 0

  deploy-pages:
    name: Deploy GitHub Pages
    needs: generate-report
    if: always() && needs.generate-report.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/github-pages-deploy.yaml
    secrets: inherit

  # Final gate so reports and Pages still deploy even when tests fail.
  outcome-gate:
    name: Outcome Gate
    needs: [playwright-saucelabs, deploy-pages]
    if: always()
    runs-on: ["${{ github.event_name == 'schedule' && 'az-dev-ubuntu-latest-8Core' || github.event.inputs.chosen-os || 'az-prod-ubuntu-latest-8Core' }}"]
    steps:
      - name: Enforce test outcome
        env:
          TEST_OUTCOME: ${{ needs.playwright-saucelabs.outputs.test-outcome }}
          UPSTREAM_RESULT: ${{ needs.playwright-saucelabs.result }}
        run: |
          echo "Test step outcome: ${TEST_OUTCOME:-unknown}"
          echo "Performance job result: ${UPSTREAM_RESULT}"
          echo "Outcome gate mode: ${{ vars.PW_OUTCOME_GATE || 'report' }}"
          if [[ "${{ vars.PW_OUTCOME_GATE }}" == "enforce" ]]; then
            if [[ "${TEST_OUTCOME}" == "failure" || "${UPSTREAM_RESULT}" != "success" ]]; then
              echo "::error title=Tests failed::See the Allure report for this run."
              exit 1
            fi
          fi