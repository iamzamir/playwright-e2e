    #       title: "UI Automation Test Results - PO-UI-INTEROP - Playwright"
    #       summary: "Test Run #${{ github.run_number }}: ${{ job.status }}"
    #       theme_color: "${{ job.status == 'success' && 'good' || job.status == 'failure' && 'danger' || 'warning' }}"
